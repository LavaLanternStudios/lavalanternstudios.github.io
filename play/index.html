<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Lava Lantern Run | Lava Lantern Studios</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>
<body>
  <div id="game-shell">
    <div id="unity-container">
      <canvas id="unity-canvas" width="540" height="960" tabindex="-1" aria-label="Lava Lantern Run"></canvas>

      <div id="unity-loading-bar" aria-live="polite">
        <div class="loading-title">Lava Lantern Run</div>
        <div id="unity-progress-bar-empty" aria-hidden="true">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="unity-loading-text">Loading...</div>
      </div>

      <div id="unity-warning" role="status" aria-live="polite"></div>

      <button id="unity-fullscreen-button" type="button" aria-label="Enter fullscreen" title="Fullscreen"></button>
    </div>
  </div>

  <!-- Keep the existing website analytics/consent bridge. -->
  <script src="play.js"></script>

  <script>
    (() => {
      const canvas = document.querySelector("#unity-canvas");
      const container = document.querySelector("#unity-container");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const loadingText = document.querySelector("#unity-loading-text");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");
      const gameShell = document.querySelector("#game-shell");

      function unityShowBanner(message, type) {
        const warningBanner = document.querySelector("#unity-warning");
        const item = document.createElement("div");
        item.className = `unity-message unity-message-${type || "info"}`;
        item.textContent = message;
        warningBanner.appendChild(item);
        warningBanner.style.display = "block";

        if (type !== "error") {
          window.setTimeout(() => {
            item.remove();
            if (!warningBanner.children.length) {
              warningBanner.style.display = "none";
            }
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = `${buildUrl}/LavaLanternRun_1.1.0_Website.loader.js`;
      const config = {
        arguments: [],
        dataUrl: `${buildUrl}/LavaLanternRun_1.1.0_Website.data.unityweb`,
        frameworkUrl: `${buildUrl}/LavaLanternRun_1.1.0_Website.framework.js.unityweb`,
        codeUrl: `${buildUrl}/LavaLanternRun_1.1.0_Website.wasm.unityweb`,
        symbolsUrl: `${buildUrl}/LavaLanternRun_1.1.0_Website.symbols.json.unityweb`,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Lava Lantern Studios",
        productName: "Lava Lantern Run",
        productVersion: "1.1.0",
        showBanner: unityShowBanner
      };

      loadingBar.style.display = "flex";

      const loaderScript = document.createElement("script");
      loaderScript.src = loaderUrl;
      loaderScript.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          const percent = Math.round(progress * 100);
          progressBarFull.style.width = `${percent}%`;
          loadingText.textContent = `Loading... ${percent}%`;
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";
          fullscreenButton.classList.add("is-ready");

          canvas.addEventListener("pointerdown", () => canvas.focus(), { passive: true });
        }).catch((error) => {
          console.error(error);
          loadingText.textContent = "Unable to load the game.";
          unityShowBanner(String(error), "error");
        });
      };

      loaderScript.onerror = () => {
        loadingText.textContent = "Unable to load the game files.";
        unityShowBanner("The game loader could not be downloaded.", "error");
      };

      document.body.appendChild(loaderScript);

      fullscreenButton.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
            return;
          }

          if (gameShell.requestFullscreen) {
            await gameShell.requestFullscreen();
          } else if (gameShell.webkitRequestFullscreen) {
            gameShell.webkitRequestFullscreen();
          }
        } catch (error) {
          console.warn("Fullscreen request failed:", error);
        }
      });

      function updateFullscreenLabel() {
        const active = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
        fullscreenButton.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
        fullscreenButton.title = active ? "Exit fullscreen" : "Fullscreen";
      }

      document.addEventListener("fullscreenchange", updateFullscreenLabel);
      document.addEventListener("webkitfullscreenchange", updateFullscreenLabel);
    })();
  </script>
</body>
</html>
